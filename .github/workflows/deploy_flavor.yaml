name: Deploy Flavor

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: ''
        type: string
        required: true
      flavor:
        description: 'Environment. Must be: DEV, BETA, PROD'
        required: true
        type: string
      version:
        description: 'App version to set for the build (e.g., 1.2.3)'
        type: string
        required: true
      increase_build_number:
        description: 'Whether to increment the build number'
        type: boolean
        required: true
        default: true
      android:
        description: 'Whether to build the Android app'
        type: boolean
        default: true
        required: true
      ios:
        description: 'Whether to build the iOS app'
        type: boolean
        default: true
        required: true
      huawei:
        description: 'Whether to build the Huawei app'
        type: boolean
        default: false
        required: true

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: validate-inputs
        shell: bash
        run: |
          echo 'validate-inputs'

  calculate-version:
    name: Calculate version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.calculate.outputs.version }}
      build_number: ${{ steps.calculate.outputs.build }}
      is_version_changed: ${{ steps.calculate.outputs.is_version_changed}}
    steps:
      - name: Calculate version
        id: calculate
        shell: bash
        run: |
          echo 'Calculate version'
          {
              echo "version=1.1.1"
              echo "build=12"
              echo "is_version_changed=true"
          } >> "$GITHUB_OUTPUT"

  notify-start:
    name: Notify Start
    runs-on: ubuntu-latest
    needs: calculate-version
    outputs:
      deployment_summary_message_block: ${{ steps.deployment_info.outputs.deployment_summary_message_block }}
      failed_actions_button: ${{ steps.failed_actions.outputs.failed_actions_button }}
      message_ts: ${{ steps.slack.outputs.ts }}
    steps:
      - name: Build enabled platforms list
        id: build_platforms
        run: |
          platforms=""
          if [ "${{ inputs.ios }}" == "true" ]; then platforms+=", iOS"; fi
          if [ "${{ inputs.android }}" == "true" ]; then platforms+=", Android"; fi
          if [ "${{ inputs.huawei }}" == "true" ]; then platforms+=", Huawei"; fi
          
          echo "list=${platforms:2}" >> $GITHUB_OUTPUT

      - name: Build deployment info block
        id: deployment_info
        shell: bash
        env:
          FLAVOR: ${{ inputs.flavor }}
          VERSION: ${{ needs.calculate-version.outputs.version }}
          BUILD_NUMBER: ${{ needs.calculate-version.outputs.build_number }}
          PLATFORMS: ${{ steps.build_platforms.outputs.list }}
        run: |
          message="*Flavor*: \`$FLAVOR\`\n*Version*: \`$VERSION ($BUILD_NUMBER)\`\n*Platforms*: \`$PLATFORMS\`"
          body='{"type": "section", "text": {"type": "mrkdwn","text": "'"$message"'"}}'
          
          echo "deployment_summary_message_block=$body" >> $GITHUB_OUTPUT

      - name: Build failed action button
        id: failed_actions
        shell: bash
        run: |
          actions_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          button='{
                    "type": "button",
                    "style": "danger",
                    "text": {"type": "plain_text","text": "View Workflow Run"},
                    "url": "'"$actions_url"'"
                  }'
          
          echo "failed_actions_button<<END" >> "$GITHUB_OUTPUT"
          echo "$button" >> "$GITHUB_OUTPUT"
          echo "END" >> "$GITHUB_OUTPUT"

      - name: Send initial Slack message
        id: slack
        uses: slackapi/slack-github-action@v2.1.1
        env:
          ATTACHMENT_COLOR: "#439FE0"
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ inputs.channel_id }}",
              "text": ":eyes: Build Started",
              "attachments": [
                {
                  "color": "${{ env.ATTACHMENT_COLOR }}",
                  "blocks": [${{ steps.deployment_info.outputs.deployment_summary_message_block }}]
                }
              ]
            }

  load-legal-documents:
    name: Load legal Documents
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: load-legal-documents
        shell: bash
        run: |
          echo 'load-legal-documents'
          exit 1

  load-partners:
    name: Load partners
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name:  load-partners
        shell: bash
        run: |
          echo ' load-partners'


  set-version:
    name: Bump version
    needs: [validate-inputs, calculate-version, load-legal-documents, load-partners]
    if: ${{ needs.calculate-version.outputs.is_version_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: set-version
        shell: bash
        run: |
          echo 'set-version'

  notify-pre-build-failure:
    name: Notify Pre-Build Failure
    runs-on: ubuntu-latest
    needs: [notify-start, load-legal-documents, load-partners, set-version, calculate-version]
    if: failure()
    steps:
      - name: Build pre-build statuses
        id: statuses
        env:
          SUCCESS_EMOJI: '✅'
          FAILED_EMOJI: '❌'
        run: |
          legal_status="${{ needs.load-legal-documents.result == 'success' && env.SUCCESS_EMOJI || env.FAILED_EMOJI }}"
          partners_status="${{ needs.load-partners.result == 'success' && env.SUCCESS_EMOJI || env.FAILED_EMOJI }}"
          
          {
            echo "legal=$legal_status"
            echo "partners=$partners_status"
          } >> $GITHUB_OUTPUT

      - name: Update Slack Message with Failure
        uses: slackapi/slack-github-action@v2.1.1
        env:
          ATTACHMENT_COLOR: "#E50051"
          FAILED_ACTIONS_BUTTON: ${{ needs.notify-start.outputs.failed_actions_button }}
          DEPLOYMENT_SUMMARY_BLOCK: ${{ needs.notify-start.outputs.deployment_summary_message_block }}
        with:
          errors: true
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ inputs.channel_id }}",
              "ts": "${{ needs.notify-start.outputs.message_ts }}",
              "attachments" : [
                {
                  "color": "${{ env.ATTACHMENT_COLOR }}",
                  "blocks": [
                    ${{ env.DEPLOYMENT_SUMMARY_BLOCK }},
                    {"type": "divider"},
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Pre-build Failed*\nOne of the initial setup steps failed.\nThe build was not started."
                      },
                      "accessory": ${{ env.FAILED_ACTIONS_BUTTON }}
                    },
                    {
                      "type": "section",
                      "fields": [
                        {"type": "mrkdwn","text": "*Load legal documents:*"},
                        {"type": "plain_text","text": ${{ steps.statuses.outputs.legal }}},
                        {"type": "mrkdwn","text": "*Load partners:*"},
                        {"type": "plain_text","text": ${{ steps.statuses.outputs.partners }}}
                      ]
                    }
                  ]
                }
              ]
            }

  build-with-deploy:
    name: Build with deploy
    needs: set-version
    uses: ./.github/workflows/build_flavor.yaml
    secrets: inherit
    with:
      flavor: ${{ inputs.flavor }}
      android: ${{ inputs.android }}
      ios: ${{ inputs.ios }}
      huawei: ${{ inputs.huawei }}

  notify-build-result:
    name: Notify Build Result
    runs-on: ubuntu-latest
    needs: [notify-start, set-version, build-with-deploy]
    if: always() && needs.set-version.result == 'success'
    steps:
      - name: Summarize build results
        id: summary
        env:
          SUCCESS_ATTACHMENT_COLOR: "#2BBC9B" # Green
          FAILED_ATTACHMENT_COLOR: "#E50051" # Red
          MIXED_ATTACHMENT_COLOR: "#FFA500" # Orange
          SUCCESS_EMOJI: "✅"
          FAILED_EMOJI: "❌"
          FAILED_ACTIONS_BUTTON: ${{ needs.notify-start.outputs.failed_actions_button }}
          IOS_ENABLED: ${{ inputs.ios }}
          ANDROID_ENABLED: ${{ inputs.android }}
          HUAWEI_ENABLED: ${{ inputs.huawei }}
          IOS_RESULT: ${{ needs.build-with-deploy.outputs.ios_result }}
          ANDROID_RESULT: ${{ needs.build-with-deploy.outputs.android_result }}
          HUAWEI_RESULT: ${{ needs.build-with-deploy.outputs.huawei_result }}
        run: |
          success_count=0
          failure_count=0
          
          platform_statuses=""
          
          process_platform() {
            local name=$1
            local enabled=$2
            local result=$3
          
            if [[ "$enabled" == "true" ]]; then
              local status="Skipped"
              if [[ "$result" == "success" ]]; then
                status="$SUCCESS_EMOJI"
                success_count=$((success_count + 1))
              elif [[ "$result" == "failure" ]]; then
                status="$FAILED_EMOJI"
                failure_count=$((failure_count + 1))
              fi
          
              if [[ -n "$platform_statuses" ]]; then
                platform_statuses+=","
              fi
          
              platform_statuses+='{"type": "mrkdwn","text": "*'"$name"'*"},'
              platform_statuses+='{"type": "plain_text","text": "'"$status"'"}'
            fi
          }
          
          process_platform "iOS" "$IOS_ENABLED" "$IOS_RESULT"
          process_platform "Android" "$ANDROID_ENABLED" "$ANDROID_RESULT"
          process_platform "Huawei" "$HUAWEI_ENABLED" "$HUAWEI_RESULT"
          
          if (( failure_count == 0 && success_count > 0 )); then
            # ALL SUCCESS
            color="$SUCCESS_ATTACHMENT_COLOR"
            summary_text="*Build Successful* :party-github:\nAll platforms were built successfully"
            accessory_json_data=""
          elif (( success_count == 0 && failure_count > 0 )); then
            # ALL FAILED
            color="$FAILED_ATTACHMENT_COLOR"
            summary_text="*Build Failed* :this_is_fine:\nAll platform builds completed with failures"
            accessory_json_data=',"accessory": '"${FAILED_ACTIONS_BUTTON}"''
          else
            # MIXED RESULTS (at least one failure)
            color="$MIXED_ATTACHMENT_COLOR"
            summary_text="*Build Unstable* :this-is-fine-fire:\n One or more platform builds completed with failures"
            accessory_json_data=',"accessory": '"${FAILED_ACTIONS_BUTTON}"''
          fi
          
          {
            echo "attachment_color=$color"
            echo "summary_text=$summary_text"
            echo "accessory_json<<END"
            echo "$accessory_json_data"
            echo "END"
            echo "platform_statuses=$platform_statuses"
          } >> $GITHUB_OUTPUT 

      - name: Update Slack Message with Build Summary
        uses: slackapi/slack-github-action@v2.1.1
        env:
          ATTACHMENT_COLOR: ${{ steps.summary.outputs.attachment_color }}
          DEPLOYMENT_SUMMARY_BLOCK: ${{ needs.notify-start.outputs.deployment_summary_message_block }}
          SUMMARY_TEXT: ${{ steps.summary.outputs.summary_text }}
          ACCESSORY_JSON: ${{ steps.summary.outputs.accessory_json }}
          PLATFORM_STATUSES: ${{ steps.summary.outputs.platform_statuses }}
        with:
          errors: true
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ inputs.channel_id }}",
              "ts": "${{ needs.notify-start.outputs.message_ts }}",
              "attachments": [
                {
                  "color": "${{ env.ATTACHMENT_COLOR }}",
                  "blocks": [
                    ${{ env.DEPLOYMENT_SUMMARY_BLOCK }},
                    {"type": "divider"},
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ env.SUMMARY_TEXT }}"
                      }
                      ${{ env.ACCESSORY_JSON }}
                    },
                    {
                      "type": "section",
                      "fields": [
                        ${{ env.PLATFORM_STATUSES }}
                      ]
                    }
                  ]
                }
              ]
            }

  final-ping:
    name: Send Final Ping
    runs-on: ubuntu-latest
    if: always() && (needs.notify-build-result.result != 'skipped' || needs.notify-pre-build-failure.result != 'skipped')
    needs: [ notify-start, notify-pre-build-failure, build-with-deploy, notify-build-result]
    steps:
      - name: Send threaded reply with channel mention
        uses: slackapi/slack-github-action@v2.1.1
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ inputs.channel_id }}",
              "thread_ts": "${{ needs.notify-start.outputs.message_ts }}",
              "text": "<!here> The workflow has completed.\nPlease review the results above."
            }