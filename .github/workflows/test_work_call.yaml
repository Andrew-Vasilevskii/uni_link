name: Test workflow on call

on:
  workflow_dispatch:
    inputs:
      success:
        type: boolean
        required: true
        default: true

jobs:
  test1:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "first job"
          sleep 20

  test:
    runs-on: ubuntu-latest
    if: ${{ inputs.success }}
    steps:
      - shell: bash
        run: |
          echo "on success job"

  test2:
    needs: [ test, test1]
    runs-on: ubuntu-latest
    if: cancelled() && needs.test.result == 'success'
    steps:
      - shell: bash
        run: |
          echo "THIRD job"
