
on:
  workflow_dispatch:

jobs:
  collect-changelog:
    name: Collect changelog
    runs-on: ubuntu-latest
    outputs:
      changelog_md: ${{ steps.generate.outputs.markdown }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: generate
        run: |
          scripts/changelog/generate_changelog.sh \
            --flavor "BETA" \
            --version "1.0.0" \
            --build "1" \
            --output changelog.md
          echo "markdown<<EOF" >> "$GITHUB_OUTPUT"
          cat changelog.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md
  
  notify-build-finish:
    name: Send Final Ping
    runs-on: ubuntu-latest
    needs: [ collect-changelog ]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/slack_actions/notify_build_finish/
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel_id: ${{ secrets.SLACK_BUILDS_CHANNEL_ID }}
          changelog_md: ${{ needs.collect-changelog.outputs.changelog_md }}
