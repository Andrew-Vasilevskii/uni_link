name: 'Notify Build  Finish'
description: 'Sends a final Slack ping in the original build thread when workflow completes.'

inputs:
  slack_bot_token:
    description: 'Slack bot token used to authenticate API requests'
    required: true
  slack_channel_id:
    description: 'Slack channel ID to post the message with ping in thread'
    required: true
  changelog_md:
    description: 'Optional changelog markdown to append to the final message'
    required: false

runs:
  using: "composite"
  steps:
    - name: Download changelog artifact
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: changelog
        path: .
    
    - name: Send completion message with channel mention
      id: slack_main
      uses: slackapi/slack-github-action@v2.1.1
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
      with:
        errors: true
        method: chat.postMessage
        token: ${{ env.SLACK_BOT_TOKEN }}
        payload: |
          {
            "channel": "${{ env.SLACK_CHANNEL_ID }}",
            "text": "<!here> The workflow has completed.\nPlease review the results above."
          }

    # Upload changelog as file (not rendered as markdown in Slack)
    # - name: Upload changelog file to Slack
    #   if: ${{ inputs.changelog_md != '' }}
    #   uses: slackapi/slack-github-action@v2.1.1
    #   env:
    #     SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
    #     SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
    #     THREAD_TS: ${{ fromJson(steps.slack_main.outputs.response).ts }}
    #   with:
    #     errors: true
    #     method: files.uploadV2
    #     token: ${{ env.SLACK_BOT_TOKEN }}
    #     payload: |
    #       {
    #         "channel_id": "${{ env.SLACK_CHANNEL_ID }}",
    #         "thread_ts": "${{ env.THREAD_TS }}",
    #         "file": "changelog.md",
    #         "filename": "changelog.md",
    #         "title": "Changelog"
    #       }

    - name: Post changelog as threaded messages
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
        THREAD_TS: ${{ fromJson(steps.slack_main.outputs.response).ts }}
      run: |
        # Check if changelog file exists
        if [[ ! -f changelog.md ]]; then
          echo "No changelog.md found, skipping changelog post"
          exit 0
        fi
        
        # Read changelog from file
        changelog_content=$(cat changelog.md)
        
        MAX_LENGTH=3000
        
        # Function to send a message chunk
        send_chunk() {
          local chunk="$1"
          local chunk_json=$(jq -Rs . <<< "$chunk")
          
          curl -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "channel": "'"$SLACK_CHANNEL_ID"'",
              "thread_ts": "'"$THREAD_TS"'",
              "text": '"$chunk_json"',
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": '"$chunk_json"'
                  }
                }
              ]
            }'
          
          sleep 1
        }
        
        # Split and send changelog
        if [[ ${#changelog_content} -le $MAX_LENGTH ]]; then
          # Send as single message
          send_chunk "$changelog_content"
        else
          # Split into chunks by complete lines
          current_chunk=""
          
          while IFS= read -r line || [[ -n "$line" ]]; do
            # Check if adding this line would exceed the limit
            test_chunk="${current_chunk}${line}"$'\n'
            
            if [[ ${#test_chunk} -gt $MAX_LENGTH ]]; then
              # Send current chunk if it's not empty
              if [[ -n "$current_chunk" ]]; then
                send_chunk "$current_chunk"
                current_chunk=""
              fi
              
              # If a single line is longer than MAX_LENGTH, send it anyway
              if [[ ${#line} -gt $MAX_LENGTH ]]; then
                send_chunk "$line"
              else
                current_chunk="${line}"$'\n'
              fi
            else
              current_chunk="$test_chunk"
            fi
          done <<< "$changelog_content"
          
          # Send remaining chunk
          if [[ -n "$current_chunk" ]]; then
            send_chunk "$current_chunk"
          fi
        fi
