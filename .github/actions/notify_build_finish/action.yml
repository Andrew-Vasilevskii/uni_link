name: 'Notify Build  Finish'
description: 'Sends a final Slack ping in the original build thread when workflow completes.'

inputs:
  slack_bot_token:
    description: 'Slack bot token used to authenticate API requests'
    required: true
  slack_channel_id:
    description: 'Slack channel ID to post the message with ping in thread'
    required: true
  changelog_md:
    description: 'Optional changelog markdown to append to the final message'
    required: false

runs:
  using: "composite"
  steps:
    - name: Download changelog artifact
      id: download_changelog
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: changelog
        path: .
    
    - name: Send completion message with channel mention
      id: slack_main
      uses: slackapi/slack-github-action@v2.1.1
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
      with:
        errors: true
        method: chat.postMessage
        token: ${{ env.SLACK_BOT_TOKEN }}
        payload: |
          {
            "channel": "${{ env.SLACK_CHANNEL_ID }}",
            "text": "<!here> The workflow has completed.\nPlease review the results above."
          }

    # Upload changelog as file (not rendered as markdown in Slack)
    - name: Upload changelog file to Slack
      if: steps.download_changelog.outcome == 'success'
      uses: slackapi/slack-github-action@v2.1.1
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
        THREAD_TS: ${{ fromJson(steps.slack_main.outputs.response).ts }}
      with:
        errors: true
        method: files.uploadV2
        token: ${{ env.SLACK_BOT_TOKEN }}
        payload: |
          {
            "channel_id": "${{ env.SLACK_CHANNEL_ID }}",
            "thread_ts": "${{ env.THREAD_TS }}",
            "file": "changelog.md",
            "filename": "changelog.md",
            "title": "Changelog"
          }
