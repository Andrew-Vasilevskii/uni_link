name: 'Notify Build  Finish'
description: 'Sends a final Slack ping in the original build thread when workflow completes.'

inputs:
  slack_bot_token:
    description: 'Slack bot token used to authenticate API requests'
    required: true
  slack_channel_id:
    description: 'Slack channel ID to post the message with ping in thread'
    required: true
  changelog_md:
    description: 'Optional changelog markdown to append to the final message'
    required: false

runs:
  using: "composite"
  steps:
    - name: Build attachment payload
      id: build_attachment_payload
      shell: bash
      env:
        ATTACHMENT_COLOR: "#439FE0" # Blue
        CHANGELOG_MD: ${{ inputs.changelog_md }}
      run: |
        if [[ -z "${CHANGELOG_MD}" ]]; then
          echo "attachments_json=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        changelog_md_json='{"type": "section", "text": {"type": "mrkdwn", "text": "'"$CHANGELOG_MD"'"}}'
        attachments_data='{
                            "color": "'"$ATTACHMENT_COLOR"'",
                            "blocks": [
                              '"$changelog_md_json"'
                            ]
                          }'

        attachments=',"attachments": ['"$attachments_data"']'

        echo "attachments_json<<END" >> "$GITHUB_OUTPUT"
        echo "$attachments" >> "$GITHUB_OUTPUT"
        echo "END" >> "$GITHUB_OUTPUT"

    - name: Send threaded reply with channel mention
      id: slack
      uses: slackapi/slack-github-action@v2.1.1
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
        THREAD_TS: ${{ inputs.message_ts }}
        ATTACHMENT_JSON: ${{ steps.build_attachment_payload.outputs.attachments_json }}
      with:
        errors: true
        method: chat.postMessage
        token: ${{ env.SLACK_BOT_TOKEN }}
        payload: |
          {
            "channel": "${{ env.SLACK_CHANNEL_ID }}",
            "text": "<!here> The workflow has completed.\nPlease review the results above.
            "${{ env.ATTACHMENT_JSON }}
          }
