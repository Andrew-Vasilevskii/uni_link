<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Link Example</title>
  <style>
    .link-button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .link-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <button class="link-button" onclick="window.location.href='https://app.test.hansefit.de/profile';">
    Go to Example
  </button>
  <a href="https://app.test.hansefit.de/profile">Visit W3Schools.com!</a>

</body>
</html>
